<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111B2C">
<title>Sequenza Esatta · Gioca</title>
<style>
:root{
  color-scheme:dark;
  --bg:#111B2C;
  --panel:#1B2A41;
  --board:#E6ECF5;
  --muted:#B7C5D9;
  --violet:#7B5CFF;
  --teal:#17D9C6;
  --ink:#1B2A41;
  --bad:#E5383B
}
*{
  box-sizing:border-box
}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.45
}
button,input{
  font:inherit
}
button{
  cursor:pointer;
  border:1px solid #50617b;
  border-radius:12px;
  background:#283c57;
  color:#fff;
  padding:11px 14px;
  font-weight:750;
  touch-action:manipulation
}
button:disabled{
  cursor:default;
  opacity:.42
}
button:focus-visible,input:focus-visible,summary:focus-visible{
  outline:3px solid var(--teal);
  outline-offset:3px
}
button.primary{
  background:var(--violet);
  border-color:#b5a4ff
}
button.danger{
  background:#792b3d
}
button.small{
  padding:7px 10px;
  font-size:.86rem
}
button.ghost{
  background:transparent
}
input{
  min-width:0;
  width:100%;
  border:1px solid #71839b;
  border-radius:12px;
  background:#fff;
  color:var(--ink);
  padding:13px;
  font-size:1.05rem
}
input[type=checkbox]{
  width:20px;
  height:20px;
  accent-color:var(--teal)
}
label{
  display:grid;
  gap:6px;
  font-weight:650
}
h1,h2,h3,p{
  margin:0
}
h1{
  font-size:clamp(1.8rem,6vw,2.6rem);
  line-height:1.1
}
h2{
  font-size:1.12rem
}
h3{
  font-size:1rem
}
small,.muted{
  color:var(--muted);
  font-size:.87rem
}
.stack{
  display:grid;
  gap:14px
}
.row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}
.spread{
  justify-content:space-between
}
.panel{
  min-width:0;
  background:var(--panel);
  border:1px solid #34465f;
  border-radius:18px;
  padding:16px
}
.page{
  max-width:1120px;
  margin:auto;
  padding:20px max(12px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))
}
.entry{
  max-width:440px;
  margin:7vh auto
}
.entry header{
  display:grid;
  gap:12px;
  margin-bottom:25px
}
.brand{
  color:#b9a7ff;
  font-size:.8rem;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase
}
.dots{
  display:flex;
  gap:9px;
  margin-bottom:10px
}
.dots i{
  display:block;
  width:18px;
  height:18px;
  border-radius:50%
}
.wide{
  width:100%
}
.status{
  background:#263d53;
  border:1px solid #547390;
  border-radius:12px;
  padding:11px 14px;
  margin-bottom:12px
}
.status.error{
  background:#552337;
  border-color:#d9677c
}
.status:empty{
  display:none
}
.connection{
  margin-bottom:12px;
  color:#ffdb84
}
.connection:empty{
  display:none
}
.topbar{
  display:grid;
  gap:10px;
  margin-bottom:14px
}
.turn.mine{
  color:var(--teal);
  font-weight:800
}
.turn{
  font-weight:700
}
.toggle{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:.85rem
}
.layout{
  display:grid;
  gap:14px
}
.play-column{
  min-width:0;
  display:grid;
  gap:14px;
  align-content:start
}
.players{
  list-style:none;
  padding:0;
  margin:0;
  display:grid;
  gap:9px
}
.player{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
  background:#243852
}
.player.me{
  outline:2px solid var(--teal)
}
.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  display:inline-grid;
  place-items:center;
  font-weight:850;
  flex-shrink:0
}
.player-name{
  overflow-wrap:anywhere;
  flex:1
}
.chip{
  font-size:.76rem;
  padding:3px 7px;
  border-radius:7px;
  background:#334a68
}
.tile{
  display:inline-grid;
  place-items:center;
  position:relative;
  width:54px;
  height:54px;
  border-radius:50%;
  background:var(--tile);
  color:var(--ink);
  flex-shrink:0;
  vertical-align:middle;
  border:2px solid #ffffff70;
  padding:0
}
.tile svg{
  width:94%;
  height:94%;
  display:block;
  overflow:visible
}
.tile svg text{
  font-family:system-ui,sans-serif;
  font-weight:850;
  fill:var(--ink);
  font-size:27px;
  text-anchor:middle;
  dominant-baseline:central
}
.tile.hidden{
  font-size:24px;
  font-weight:850
}
.tile.crossed{
  opacity:.38
}
.tile.crossed:after{
  content:"";
  position:absolute;
  left:7%;
  right:7%;
  height:3px;
  transform:rotate(-40deg);
  background:#111b2c;
  box-shadow:0 0 0 1px #ffffff90
}
.tile.selected{
  outline:3px solid var(--teal);
  outline-offset:2px
}
.tile.mini{
  width:33px;
  height:33px
}
.tile.mini svg text{
  font-size:25px
}
.tiles{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}
.piles{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.pile{
  min-width:49px;
  border-color:var(--tile);
  border-top:6px solid var(--tile);
  padding:8px 12px;
  background:#22354e
}
.pile strong{
  display:block;
  font-size:1.1rem
}
.rack{
  display:flex;
  align-items:flex-start;
  gap:5px;
  overflow-x:auto;
  padding:8px 3px 12px;
  scrollbar-width:thin
}
.rack-slot{
  display:grid;
  gap:7px;
  justify-items:center;
  min-width:68px;
  max-width:90px
}
.gap{
  display:flex;
  flex-direction:column;
  gap:5px;
  align-items:center;
  min-width:15px;
  border-top:2px dashed #63758e;
  padding-top:7px;
  margin-top:21px;
  min-height:22px
}
.badges{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
  justify-content:center
}
.badge{
  font-size:.72rem;
  padding:2px 5px;
  background:#344965;
  border-radius:6px;
  white-space:nowrap
}
.badge.no{
  text-decoration:line-through;
  text-decoration-thickness:1px
}
.symbols{
  display:flex;
  gap:3px;
  flex-wrap:wrap;
  justify-content:center
}
.symbol-toggle{
  padding:3px;
  width:28px;
  height:28px;
  border-radius:6px;
  background:#344965
}
.symbol-toggle svg{
  width:100%;
  height:100%
}
.symbol-toggle.excluded{
  opacity:.3;
  background:#161f2c;
  text-decoration:line-through
}
.board-scroll{
  overflow:auto;
  max-width:100%;
  padding:4px 0
}
.board-row{
  display:flex;
  gap:5px;
  margin:7px 0;
  min-width:max-content
}
.board-row .tile{
  width:39px;
  height:39px
}
.board-panel{
  min-width:0
}
.board-panel .muted{
  font-size:.8rem
}
.opponent{
  padding:12px 0;
  border-bottom:1px solid #3a4b62
}
.opponent:last-child{
  border:0
}
.opponent .rack-slot{
  min-width:56px
}
.opponent .tile:not(.mini){
  width:46px;
  height:46px
}
.history{
  padding-left:20px;
  color:#c8d4e5;
  font-size:.86rem;
  max-height:250px;
  overflow:auto
}
.history li{
  margin:7px 0
}
.notice{
  padding:10px;
  border-radius:10px;
  background:#493c29;
  color:#ffe2a9;
  font-size:.87rem
}
.ranking{
  display:grid;
  gap:8px
}
.ranking-row{
  display:grid;
  grid-template-columns:30px 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px;
  border-radius:12px;
  background:#293d57
}
.rank{
  font-size:1.35rem;
  font-weight:850;
  color:#d9cfff
}
.points{
  font-weight:850;
  text-align:right
}
.results{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin:18px 0
}
.result{
  display:grid;
  justify-items:center;
  gap:8px;
  animation:reveal .35s both;
  animation-delay:var(--delay)
}
.result.ok{
  color:#5be8a0
}
.result.wrong{
  color:#ff8d9d
}
.result .tile{
  outline:3px solid currentColor
}
.picker{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(55px,1fr));
  gap:10px;
  margin:14px 0
}
.picker .tile{
  justify-self:center
}
dialog{
  color:#fff;
  background:var(--panel);
  border:1px solid #647695;
  border-radius:20px;
  width:min(94vw,560px);
  max-height:88dvh;
  padding:20px;
  overflow:auto
}
dialog::backdrop{
  background:#050a14c9;
  backdrop-filter:blur(3px)
}
.dialog-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:12px;
  margin-bottom:15px
}
.dialog-head button{
  padding:5px 10px
}
.dialog-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px
}
.compare-targets{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px
}
.empty{
  padding:10px 0;
  color:var(--muted)
}
@keyframes reveal{
  from{
    opacity:0;
    transform:translateY(10px) scale(.8)
  }
  to{
    opacity:1;
    transform:none
  }
}
@media(min-width:850px){
  .layout{
    grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)
  }
  .board-panel{
    align-self:start;
    position:sticky;
    top:14px
  }
}
@media(max-width:380px){
  .panel{
    padding:12px
  }
  .page{
    padding-left:9px;
    padding-right:9px
  }
  .tile{
    width:49px;
    height:49px
  }
}
@media(prefers-reduced-motion:reduce){
  *{
    animation:none!important;
    scroll-behavior:auto!important
  }
}

.orientation-notice{display:none}
@media (orientation:portrait) and (max-width:900px) and (any-pointer:coarse){
  .orientation-notice{
    display:flex;align-items:center;gap:14px;
    margin:12px max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    padding:16px;border:2px solid var(--violet);border-radius:18px;
    background:linear-gradient(135deg,#34235c,var(--panel));
    box-shadow:0 5px 0 #0a1120;
  }
  .orientation-notice svg{width:48px;height:48px;flex-shrink:0;color:var(--teal)}
  .orientation-notice strong{display:block;font-size:1.1rem}
  .orientation-notice p{margin:5px 0 0;color:var(--muted);font-size:1rem}
  .orientation-notice button{margin-top:10px}
}
</style>
</head>
<body>
<aside class="orientation-notice" aria-label="Orientamento del telefono">
  <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
    <rect x="11" y="15" width="30" height="20" rx="4"/>
    <path d="M35 23v4M8 25A16 16 0 0 1 25 8M19 3l6 5-6 5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div><strong>Ruota il telefono in orizzontale</strong>
    <p>Vedrai meglio il tabellone e le tue tessere, come nell’app.</p>
    <p id="orientation-help">Se lo schermo non ruota, disattiva il blocco rotazione del telefono.</p>
    <button id="landscape-button" class="primary" type="button" hidden>Attiva schermo intero e orizzontale</button>
  </div>
</aside>

<main class="page">
  <div id="message" class="status" role="alert"></div>
  <div id="connection" class="connection" role="status" aria-live="polite"></div>
  <div id="app"></div>
</main>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<noscript>Attiva JavaScript per partecipare a Sequenza Esatta.</noscript>
<script>
"use strict";

// Orientation is an enhancement. Rejections must never interrupt the game.
const landscapeButton = document.getElementById("landscape-button");
if (typeof screen.orientation?.lock === "function" &&
    typeof document.documentElement.requestFullscreen === "function" && document.fullscreenEnabled) {
  landscapeButton.hidden = false;
  landscapeButton.addEventListener("click", async () => {
    landscapeButton.disabled = true;
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      await screen.orientation.lock("landscape");
    } catch {
      document.getElementById("orientation-help").textContent =
        "Il browser non consente la rotazione automatica. Ruota il telefono e disattiva il blocco rotazione se necessario.";
    } finally {
      landscapeButton.disabled = false;
    }
  });
}

const RELAY_WS_URL = "wss://sequenzaesatta-relay.onrender.com/relay";
const params = new URLSearchParams(location.search);
const relayUrl = params.get("relay") || RELAY_WS_URL;
const TILE_COLORS = ["#FF3EA5", "#F2E04A", "#FF8C69", "#17D9C6", "#7B5CFF", "#3FA9FF", "#6CCB4A"];
const PLAYER_COLORS = ["#1F6FD6", "#D9480F", "#1E8E3E", "#C2255C", "#6741D9", "#0C8599", "#9C6B00", "#5C677D"];
const SYMBOL_NAMES = ["triangolo", "quadrato", "cerchio", "esagono", "stella"];
const STATUS_NAMES = ["Sequenza esatta", "In gara", "Ha rinunciato", "Sequenza errata", "Escluso"];
const SHAPES = [
  '<path d="M50 8 94 88H6Z"/>',
  '<rect x="12" y="12" width="76" height="76" rx="12"/>',
  '<circle cx="50" cy="50" r="42"/>',
  '<path d="M28 9H72L96 50 72 91H28L4 50Z"/>',
  '<path d="M50 3 63 33 97 36 71 58 79 92 50 74 21 92 29 58 3 36 37 33Z"/>'
];
const app = document.getElementById("app");
const modal = document.getElementById("modal");
let roomCode = (params.get("room") || "").toUpperCase().slice(0, 5);
let playerName = "", token = "", currentGameId = "", sequence = 0, pending = null;
let socket = null, reconnectTimer = null, handshakeTimer = null, retryDelay = 1000;
let active = false, ready = false, synchronized = false, lastHostReply = 0;
let view = null, lobby = null, screen = "entry", autoCross = true, opponentsOpen = false;
let notes = [], crossedByHand = new Set(), excludedSymbols = [];
let dialogState = null, declarationQueue = [], seenDeclarations = new Set(), finalShown = false;
let history = [], historyKeys = new Set();

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, character => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[character]);
}
function message(text = "", error = false) {
  const element = document.getElementById("message");
  element.textContent = text;
  element.className = "status" + (error ? " error" : "");
}
function connection(text = "") { document.getElementById("connection").textContent = text; }
function storageSet(key, value) {
  if (value === null) localStorage.removeItem(key);
  else localStorage.setItem(key, String(value));
}
function parseSaved(key, fallback) {
  const text = localStorage.getItem(key);
  if (!text) return fallback;
  try { return JSON.parse(text); } catch { return fallback; }
}
function persistSession() {
  // Write pending first: after a reload its sequence also recovers a partial storage write.
  storageSet("pending_" + roomCode, pending ? JSON.stringify(pending) : null);
  storageSet("sequence_" + roomCode, sequence);
  storageSet("game_" + roomCode, currentGameId);
}
function saveNotes() {
  try {
    storageSet("notes_" + roomCode + "_" + currentGameId, JSON.stringify({
      notes, crossedByHand: [...crossedByHand], excludedSymbols: excludedSymbols.map(set => [...set])
    }));
  } catch { message("Impossibile salvare gli appunti. Verifica lo spazio disponibile nel browser.", true); }
}
function restoreNotes(reset) {
  const saved = reset ? {} : parseSaved("notes_" + roomCode + "_" + currentGameId, {}) || {};
  const total = view.colors * view.symbols * view.cycles;
  notes = Array.from({ length: view.length }, (_, position) => {
    const number = saved.notes?.[position];
    return Number.isInteger(number) && number > 0 && number <= total && colorOf(number) === me().handColors[position] ? number : null;
  });
  crossedByHand = new Set((Array.isArray(saved.crossedByHand) ? saved.crossedByHand : []).filter(n => Number.isInteger(n) && n > 0 && n <= total));
  excludedSymbols = Array.from({ length: view.length }, (_, position) => new Set(
    (Array.isArray(saved.excludedSymbols?.[position]) ? saved.excludedSymbols[position] : []).filter(n => Number.isInteger(n) && n >= 0 && n < view.symbols)
  ));
  if (reset) saveNotes();
}

function integer(text) {
  if (!/^-?\d+$/.test(String(text))) throw new Error("Intero Wire non valido");
  const value = Number(text);
  if (!Number.isSafeInteger(value)) throw new Error("Intero Wire fuori limite");
  return value;
}
function integers(text, separator = ",") { return text === "" ? [] : text.split(separator).map(integer); }
function decodeClue(text) {
  const fields = text.split(":");
  const type = fields[0];
  if (type === "S" && fields.length === 3) return { type, tile: integer(fields[1]), slot: integer(fields[2]) };
  if (type === "C" && fields.length === 4) return { type, tile: integer(fields[1]), position: integer(fields[2]), same: fields[3] === "1" };
  if (type === "R" && fields.length === 2) return { type, tile: integer(fields[1]) };
  if (type === "G" && fields.length === 4) return { type, position: integer(fields[1]), number: integer(fields[2]), correct: fields[3] === "1" };
  throw new Error("Indizio Wire non valido");
}
function decodeEvent(text) {
  if (text === "-") return null;
  const fields = text.split(","), type = fields[0], player = integer(fields[1]);
  switch (type) {
    case "R": return { type, player, tile: integer(fields[2]) };
    case "Q": return { type, player, clue: decodeClue(fields[2]) };
    case "D": return { type, player, results: (fields[2] || "").split("").map(n => n === "1"), numbers: integers(fields[3] || "", ".") };
    case "U": case "K": return { type, player };
    case "N": return { type, player, connected: fields[2] === "1" };
    default: return null;
  }
}
function decodeHostMessage(wire) {
  if (typeof wire !== "string") throw new Error("Messaggio Wire assente");
  const lines = wire.split("\n");
  if (lines[0] === "X") return { type: "rejected", reason: lines[1] || "Ingresso rifiutato." };
  if (lines[0] === "L") return { type: "lobby", seat: integer(lines[1]), names: lines[2].split("\t").filter(Boolean) };
  if (lines[0] !== "U") throw new Error("Messaggio Wire sconosciuto");
  const head = integers(lines[2]);
  if (head.length !== 12) throw new Error("Intestazione Wire non valida");
  const [viewer, colors, symbols, cycles, length, currentPlayer, phase, winner, turn, round, turnPosition, activePlayers] = head;
  const players = lines.slice(5).filter(Boolean).map(line => {
    const fields = line.split("\t");
    if (fields.length !== 14) throw new Error("Giocatore Wire non valido");
    return {
      name: fields[0], handColors: integers(fields[1]), hand: fields[2] === "-" ? null : integers(fields[2]),
      clues: fields[3] ? fields[3].split(",").map(decodeClue) : [], eliminated: fields[4] === "1",
      knownCount: integer(fields[5]), connected: fields[6] === "1", kickable: fields[7] === "1",
      kickVotes: integer(fields[8]), kickVotesNeeded: integer(fields[9]), status: integer(fields[10]),
      turnsUsed: integer(fields[11]), rank: integer(fields[12]), points: integer(fields[13])
    };
  });
  if (colors < 2 || colors > 7 || symbols < 1 || symbols > 5 || cycles < 1 || cycles > 20 || length < 1 || length > 7 || phase < 0 || phase > 4 || !players[viewer]) throw new Error("Configurazione Wire non valida");
  const pool = integers(lines[3]), supplyCounts = integers(lines[4]);
  if (supplyCounts.length !== colors || players.some(player => player.handColors.length !== length)) throw new Error("Tabellone Wire incompleto");
  return { type: "update", event: decodeEvent(lines[1]), view: { viewer, colors, symbols, cycles, length, currentPlayer, phase, winner, turn, round, turnPosition, activePlayers, players, pool, supplyCounts } };
}

function send(envelope) {
  if (socket?.readyState !== WebSocket.OPEN) return false;
  socket.send(JSON.stringify(envelope));
  return true;
}
function guestSend(payload) { return send({ type: "send", payload }); }
function detachSocket() {
  clearTimeout(handshakeTimer);
  if (socket) {
    const old = socket;
    socket = null;
    old.close(1000, "Leaving");
  }
  ready = false;
  synchronized = false;
}
function leave(error = "", forget = false) {
  active = false;
  clearTimeout(reconnectTimer);
  reconnectTimer = null;
  detachSocket();
  if (forget) {
    try { storageSet("token_" + roomCode, null); storageSet("pending_" + roomCode, null); }
    catch { message("Impossibile aggiornare la sessione salvata.", true); }
  }
  view = null; lobby = null; dialogState = null; declarationQueue = [];
  screen = "entry";
  connection();
  message(error, Boolean(error));
  render();
}
function scheduleReconnect() {
  if (!active || reconnectTimer) return;
  ready = false; synchronized = false;
  connection("Collegamento interrotto. Riconnessione in corso…");
  render();
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, retryDelay);
  retryDelay = Math.min(retryDelay * 2, 10000);
}
function connect() {
  if (!active) return;

  modal.innerHTML = `<div class="dialog-head"><h2 id="modal-title">${escapeHtml(title)}</h2><button class="ghost" data-act="close-dialog" aria-label="Chiudi">×</button></div>${body}`;
  if (!modal.open) modal.showModal();
}
function handleAction(event) {
  const button = event.target.closest("button[data-act]");
  if (!button || button.disabled) return;
  const value = Number(button.dataset.value);
  switch (button.dataset.act) {
    case "leave": leave(); return;
    case "close-dialog": closeDialog(); return;
    case "opponents": opponentsOpen = !opponentsOpen; break;
    case "reveal": if (canAct() && isMyTurn() && view.phase === 0 && view.supplyCounts[value] > 0) sendMove("R," + value); return;
    case "clue": if (canAct() && isMyTurn() && view.phase === 1 && view.pool.includes(value)) dialogState = { type: "clue", tile: value }; break;
    case "sort": if (dialogState?.type === "clue" && isMyTurn() && view.phase === 1) sendMove("S," + dialogState.tile); return;
    case "compare-mode": dialogState.compare = true; break;
    case "compare": if (dialogState?.type === "clue" && isMyTurn() && view.phase === 1) sendMove(`C,${dialogState.tile},${value}`); return;
    case "pick": if (!me().eliminated) dialogState = { type: "picker", position: value }; break;
    case "note": if (dialogState?.type === "picker") { notes[dialogState.position] = value; saveNotes(); dialogState = null; } break;
    case "clear-note": if (dialogState?.type === "picker") { notes[dialogState.position] = null; saveNotes(); dialogState = null; } break;
    case "symbol": {
      const set = excludedSymbols[Number(button.dataset.pos)];
      if (set.has(value)) set.delete(value); else set.add(value);
      saveNotes(); break;
    }
    case "cross":
      if (autoCross && visibleNumbers().has(value)) return;
      if (crossedByHand.has(value)) crossedByHand.delete(value); else crossedByHand.add(value);
      saveNotes(); break;
    case "declare": if (canDeclare()) dialogState = { type: "confirm" }; break;
    case "confirm-declare": if (canDeclare()) sendMove("D," + notes.join(",")); return;
    case "giveup": if (canAct() && isMyTurn() && [2, 3].includes(view.phase)) dialogState = { type: "giveup" }; break;
    case "confirm-giveup": if (isMyTurn() && [2, 3].includes(view.phase)) sendMove("G"); return;
    case "kick": if (canAct() && view.players[value]?.kickable && value !== view.viewer) sendMove("K," + value); return;
    case "final": dialogState = { type: "final" }; break;
  }
  render();
}
app.addEventListener("click", handleAction);
modal.addEventListener("click", handleAction);
modal.addEventListener("cancel", event => { event.preventDefault(); closeDialog(); });
app.addEventListener("submit", event => {
  if (event.target.id !== "join-form") return;
  event.preventDefault();
  const data = new FormData(event.target);
  joinRoom(String(data.get("name") || ""), String(data.get("room") || ""));
});
app.addEventListener("input", event => {
  if (event.target.name === "room") event.target.value = event.target.value.toUpperCase().slice(0, 5);
});
app.addEventListener("change", event => {
  if (event.target.id !== "auto-cross") return;
  autoCross = event.target.checked;
  try { storageSet("autoCross", autoCross); } catch { message("Preferenza valida per questa sessione."); }
  render();
});
try {
  playerName = (localStorage.getItem("playerName") || "").slice(0, 16);
  autoCross = localStorage.getItem("autoCross") !== "false";
} catch { message("Il salvataggio locale è disabilitato. Abilitalo per poter recuperare la partita.", true); }
render();
</script>
</body>
